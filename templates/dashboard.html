<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #f4f6f9;
        }

        .dashboard {
            background: white;
            width: 400px;
            padding: 45px 35px;
            text-align: center;
            border-radius: 12px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.12);
        }

        h1 {
            color: #1e3a8a;
            margin-bottom: 15px;
        }

        p {
            color: #555;
            font-size: 16px;
            margin-bottom: 30px;
        }

        .logout-btn {
            display: inline-block;
            padding: 12px 35px;
            background: #dc3545;
            color: white;
            text-decoration: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
        }

        .logout-btn:hover {
            background: #b02a37;
        }
    </style>
</head>

<body>

    <div class="dashboard">

        <h1>Welcome!</h1>

        {% if session.get('username') %}
            <p>Welcome, <strong>{{ session.get('username') }}</strong>!</p>
        {% else %}
            <p>You have successfully logged in.</p>
        {% endif %}

        <a href="{{ url_for('logout') }}" class="logout-btn">
            Logout
        </a>

    </div>

</body>
</html>
