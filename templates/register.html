<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #00c6ff, #0072ff, #00d4a8);
        }

        .container {
            width: 900px;
            min-height: 560px;
            display: flex;
            background: white;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.25);
        }

        /* Left Side */
        .left-section {
            width: 45%;
            background: linear-gradient(135deg, #0066ff, #00c6a7);
            color: white;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 40px;
            text-align: center;
        }

        .left-section .icon {
            font-size: 70px;
            margin-bottom: 20px;
        }

        .left-section h1 {
            font-size: 30px;
            margin-bottom: 15px;
        }

        .left-section p {
            font-size: 16px;
            line-height: 1.6;
            opacity: 0.95;
        }

        /* Right Side */
        .right-section {
            width: 55%;
            padding: 45px 55px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .right-section h2 {
            color: #333;
            font-size: 30px;
            margin-bottom: 8px;
        }

        .subtitle {
            color: #777;
            margin-bottom: 25px;
        }

        .input-box {
            margin-bottom: 16px;
        }

        .input-box label {
            display: block;
            font-size: 14px;
            color: #555;
            margin-bottom: 6px;
        }

        .input-box input,
        .input-box select {
            width: 100%;
            padding: 13px 15px;
            border: none;
            border-bottom: 2px solid #d5d5d5;
            outline: none;
            font-size: 15px;
            background: #fafafa;
            border-radius: 5px 5px 0 0;
            transition: 0.3s;
        }

        .input-box input:focus,
        .input-box select:focus {
            border-bottom: 2px solid #00a9a5;
            background: #f5ffff;
        }

        .register-btn {
            width: 100%;
            padding: 14px;
            margin-top: 8px;
            border: none;
            border-radius: 6px;
            background: linear-gradient(90deg, #0072ff, #00c6a7);
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        .register-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 18px rgba(0, 114, 255, 0.3);
        }

        .bottom-text {
            text-align: center;
            margin-top: 20px;
            color: #777;
            font-size: 14px;
        }

        .bottom-text a {
            color: #0072ff;
            text-decoration: none;
            font-weight: bold;
        }

        .bottom-text a:hover {
            text-decoration: underline;
        }

        @media (max-width: 750px) {
            .container {
                width: 92%;
                flex-direction: column;
            }

            .left-section,
            .right-section {
                width: 100%;
            }

            .left-section {
                padding: 30px;
            }

            .right-section {
                padding: 35px 30px;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <!-- Left Section -->
        <div class="left-section">

            <div class="icon">🎓</div>

            <h1>Student Management</h1>

            <p>
                Create your student account and manage
                your academic information easily.
            </p>

        </div>


        <!-- Right Section -->
        <div class="right-section">

            <h2>Create Account</h2>

            <p class="subtitle">
                Register as a student
            </p>

            <form method="POST" action="{{ url_for('register') }}">

                <div class="input-box">
                    <label>Full Name</label>
                    <input
                        type="text"
                        name="name"
                        placeholder="Enter your full name"
                        required
                    >
                </div>

                <div class="input-box">
                    <label>Email Address</label>
                    <input
                        type="email"
                        name="email"
                        placeholder="Enter your email"
                        required
                    >
                </div>

                <div class="input-box">
                    <label>Phone Number</label>
                    <input
                        type="tel"
                        name="phone"
                        placeholder="Enter your phone number"
                        required
                    >
                </div>

                <div class="input-box">
                    <label>Course</label>

                    <select name="course" required>
                        <option value="">Select your course</option>
                        <option value="BCA">BCA</option>
                        <option value="BBA">BBA</option>
                        <option value="B.Com">B.Com</option>
                        <option value="BA">BA</option>
                        <option value="B.Sc">B.Sc</option>
                        <option value="MCA">MCA</option>
                    </select>
                </div>

                <div class="input-box">
                    <label>Password</label>

                    <input
                        type="password"
                        name="password"
                        placeholder="Create a password"
                        required
                    >
                </div>

                <button type="submit" class="register-btn">
                    CREATE ACCOUNT
                </button>

            </form>

            <p class="bottom-text">
                Already have an account?
                <a href="{{ url_for('login') }}">Login here</a>
            </p>

        </div>

    </div>

</body>
</html>
