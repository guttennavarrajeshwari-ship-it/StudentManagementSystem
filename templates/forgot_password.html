<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Forgot Password</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #7b2ff7, #b14cff, #00c6ff);
        }

        .container {
            width: 450px;
            background: white;
            padding: 45px;
            border-radius: 20px;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.25);
        }

        .icon {
            text-align: center;
            font-size: 55px;
            margin-bottom: 15px;
        }

        h2 {
            text-align: center;
            color: #333;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #777;
            margin-bottom: 30px;
        }

        .input-box {
            margin-bottom: 20px;
        }

        .input-box label {
            display: block;
            color: #555;
            font-size: 14px;
            margin-bottom: 7px;
        }

        .input-box input {
            width: 100%;
            padding: 13px;
            border: none;
            border-bottom: 2px solid #ddd;
            background: #fafafa;
            outline: none;
            font-size: 15px;
        }

        .input-box input:focus {
            border-bottom-color: #7b2ff7;
        }

        .reset-btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 6px;
            background: linear-gradient(90deg, #7b2ff7, #b14cff);
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .reset-btn:hover {
            transform: translateY(-2px);
        }

        .back {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #7b2ff7;
            text-decoration: none;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="icon">🔐</div>

        <h2>Forgot Password?</h2>

        <p class="subtitle">
            Enter your registered details to reset your password.
        </p>

        <form method="POST" action="{{ url_for('forgot_password') }}">

            <div class="input-box">
                <label>Email Address</label>
                <input
                    type="email"
                    name="email"
                    placeholder="Enter your registered email"
                    required
                >
            </div>

            <div class="input-box">
                <label>Phone Number</label>
                <input
                    type="tel"
                    name="phone"
                    placeholder="Enter your registered phone"
                    required
                >
            </div>

            <div class="input-box">
                <label>New Password</label>
                <input
                    type="password"
                    name="new_password"
                    placeholder="Enter your new password"
                    required
                >
            </div>

            <button type="submit" class="reset-btn">
                RESET PASSWORD
            </button>

        </form>

        <a href="{{ url_for('login') }}" class="back">
            ← Back to Login
        </a>

    </div>

</body>
</html>
