<!DOCTYPE html>
<html>

<head>
    <title>Teacher Login</title>

    <style>

        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f9;
            margin: 0;
        }

        .navbar {
            background-color: #000000;
            color: white;
            padding: 20px;
            text-align: center;
        }

        .container {
            width: 400px;
            margin: 70px auto;
            background-color: white;
            padding: 35px;
            border-radius: 10px;
            box-shadow: 0 3px 10px rgba(0,0,0,0.15);
        }

        h2 {
            text-align: center;
            color: #000000;
            margin-bottom: 30px;
        }

        label {
            display: block;
            margin-top: 15px;
            margin-bottom: 6px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 11px;
            border: 1px solid #ccc;
            border-radius: 5px;
            box-sizing: border-box;
        }

        .login-button {
            width: 100%;
            margin-top: 25px;
            padding: 12px;
            border: none;
            border-radius: 5px;
            background-color: #000000;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        .login-button:hover {
            background-color: #333333;
        }

        .back {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #000000;
            text-decoration: none;
        }

    </style>

</head>

<body>

    <div class="navbar">
        <h2>Student Management System</h2>
    </div>


    <div class="container">

        <h2>Teacher Login</h2>

        <form method="POST" action="/teacher_login">

            <label>Email</label>

            <input
                type="email"
                name="email"
                placeholder="Enter teacher email"
                required
            >


            <label>Password</label>

            <input
                type="password"
                name="password"
                placeholder="Enter password"
                required
            >


            <button type="submit" class="login-button">
                Login
            </button>

        </form>


        <a href="/" class="back">
            ← Back to Home
        </a>

    </div>

</body>

</html>
